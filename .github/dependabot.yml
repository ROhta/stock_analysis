version: 2
updates:
  - package-ecosystem: "npm"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Asia/Tokyo"
    # package.json はルートに無く financialStatements 配下のみ。"/" のままだと
    # スケジュール実行のバージョン更新が対象ゼロ（下の ignore も効かない）になる。
    directory: "/financialStatements"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "_"
    rebase-strategy: "auto"
    versioning-strategy: increase-if-necessary
    # パッチ更新は PR 化しない（マイナー以上のみ PR 化する）。ノイズ削減が目的。
    # セキュリティ更新はこの ignore の影響を受けず、パッチ版の脆弱性修正でも PR は作られる
    # （dependabot-core の silent/tests/testdata/su-err-all-versions-ignored.txt が
    # security-updates-only + ignore-conditions で PR が作られることをアサートしている）。
    # 実例: PR #30 は npm_and_yarn group 経由の vite 6.4.2 → 6.4.3（パッチ）。
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
  - package-ecosystem: "github-actions"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    directory: "/"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "_"
    rebase-strategy: "auto"
    # パッチ更新は PR 化しない（マイナー以上のみ PR 化する）。ノイズ削減が目的。
    # 上の npm ブロックと同様、セキュリティ更新はこの ignore の影響を受けない。
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
