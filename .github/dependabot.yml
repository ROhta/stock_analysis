version: 2
updates:
  - package-ecosystem: "npm"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Asia/Tokyo"
    # package.json はルートに無く financialStatements 配下のみ。"/" のままだと
    # スケジュール実行のバージョン更新が対象ゼロ（下の ignore も効かない）になる。
    directory: "/financialStatements"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "_"
    rebase-strategy: "auto"
    versioning-strategy: increase-if-necessary
    # パッチ・マイナー更新は PR 化しない（メジャーのみ PR 化する）。ノイズ削減が目的。
    # 注意: 0.x 系の依存は semver 上の major 相当の破壊的変更が minor として扱われるため、
    # この ignore に吸収される（PR は作られない）。
    # セキュリティ更新はこの ignore の影響を受けず、パッチ・マイナー版の脆弱性修正でも PR は作られる
    # （dependabot-core の silent/tests/testdata/su-err-all-versions-ignored.txt が
    # security-updates-only + ignore-conditions で PR が作られることをアサートしている）。
    # 実例: PR #30 は npm_and_yarn group 経由の vite 6.4.2 → 6.4.3（パッチ）。
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
    # react 系は版を揃える必要があるため 1 つの PR にまとめる。recharts は react-is を
    # optional 指定の無い必須 peer dependency として要求し、React 19 では react と react-is の
    # 版一致が求められる。個別 PR だと react だけ上がって react-is が取り残され、peer 要件が
    # 崩れる（実際に react 19.2.8 に対し react-is 18.3.1 が入っていた）。
    # パターンに一致しない依存は従来どおり個別 PR で更新されるため、他への影響は無い。
    groups:
      npm-react-dependencies:
        patterns:
          - "react"
          - "react-dom"
          - "react-is"
  - package-ecosystem: "github-actions"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    directory: "/"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "_"
    rebase-strategy: "auto"
    # パッチ・マイナー更新は PR 化しない（メジャーのみ PR 化する）。ノイズ削減が目的。
    # 上の npm ブロックと同様、セキュリティ更新はこの ignore の影響を受けない。
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
